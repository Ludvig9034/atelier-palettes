<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loud Colors · Brand presets comparison</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0A0A0A; color: #FCFCFC;
      font-family: ui-monospace, monospace;
      overflow: hidden;
    }

    /* Toolbar */
    .toolbar {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 1000;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 6px 6px 14px; border-radius: 999px;
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .toolbar-label { color: rgba(255, 255, 255, 0.4); margin-right: 4px; }
    .toolbar button {
      background: transparent; border: none;
      color: rgba(255, 255, 255, 0.55);
      font-family: inherit; font-size: 11px;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 7px 12px; border-radius: 999px;
      cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .toolbar button:hover { color: #FCFCFC; }
    .toolbar button.active { background: rgba(255, 255, 255, 0.12); color: #FCFCFC; }
    .toolbar .swap {
      background: #FF3D14; color: #fff;
    }
    .toolbar .swap:hover { background: #D62E0B; color: #fff; }
    .toolbar .open-full {
      background: rgba(255, 255, 255, 0.08);
      padding: 7px 12px; border-radius: 999px;
      text-decoration: none; color: rgba(255,255,255,0.7);
      font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
    }
    .toolbar .open-full:hover { background: rgba(255,255,255,0.16); color: #fff; }

    /* Frame layout */
    .compare {
      display: grid; grid-template-columns: 1fr 1fr;
      height: 100vh; gap: 0;
    }
    .compare.stacked { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }

    .frame-wrap {
      position: relative;
      overflow: hidden;
      background: #FCFCFC;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .frame-wrap:last-child { border-right: none; }
    .compare.stacked .frame-wrap { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .compare.stacked .frame-wrap:last-child { border-bottom: none; }

    .frame-label {
      position: absolute; top: 14px; left: 14px; z-index: 5;
      background: rgba(0, 0, 0, 0.7); color: #fff;
      padding: 6px 12px; border-radius: 999px;
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      backdrop-filter: blur(8px);
      display: inline-flex; align-items: center; gap: 8px;
      pointer-events: none;
    }
    .frame-label-dot { width: 6px; height: 6px; border-radius: 50%; background: #FF3D14; }

    iframe {
      width: 100%; height: 100%; border: 0;
      display: block;
      background: #FCFCFC;
    }

    /* Mobile */
    @media (max-width: 980px) {
      body { overflow: auto; }
      .compare { grid-template-columns: 1fr; height: auto; }
      .frame-wrap { height: 100vh; }
      .compare.stacked .frame-wrap { height: 100vh; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <span class="toolbar-label">Layout</span>
    <button id="view-split" class="active">Split</button>
    <button id="view-stacked">Stacked</button>
    <button class="swap" id="swap">↔ Swap</button>
    <a class="open-full" id="open-a" href="preview-loud-space.html" target="_blank">A ↗</a>
    <a class="open-full" id="open-b" href="preview-loud-syne.html" target="_blank">B ↗</a>
  </div>

  <div class="compare" id="compare">
    <div class="frame-wrap" id="wrap-a">
      <div class="frame-label"><span class="frame-label-dot"></span>Preset A · Space + Inter</div>
      <iframe src="preview-loud-space.html" title="Preset A — Space + Inter"></iframe>
    </div>
    <div class="frame-wrap" id="wrap-b">
      <div class="frame-label"><span class="frame-label-dot"></span>Preset B · Syne + PP Neue</div>
      <iframe src="preview-loud-syne.html" title="Preset B — Syne + PP Neue"></iframe>
    </div>
  </div>

  <script>
    const compare = document.getElementById('compare');
    const wrapA = document.getElementById('wrap-a');
    const wrapB = document.getElementById('wrap-b');
    const btnSplit = document.getElementById('view-split');
    const btnStacked = document.getElementById('view-stacked');
    const btnSwap = document.getElementById('swap');

    btnSplit.addEventListener('click', () => {
      compare.classList.remove('stacked');
      btnSplit.classList.add('active');
      btnStacked.classList.remove('active');
    });
    btnStacked.addEventListener('click', () => {
      compare.classList.add('stacked');
      btnStacked.classList.add('active');
      btnSplit.classList.remove('active');
    });
    btnSwap.addEventListener('click', () => {
      if (wrapA.nextElementSibling === wrapB) {
        compare.insertBefore(wrapB, wrapA);
      } else {
        compare.insertBefore(wrapA, wrapB);
      }
    });
  </script>

</body>
</html>
